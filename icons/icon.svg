<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6bff"/>
      <stop offset="1" stop-color="#2c48e6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse" x="6" y="6">
      <circle cx="11" cy="11" r="2.2" fill="#d6d5cd"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b1a66" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- tấm bảng -->
  <g filter="url(#sh)">
    <rect x="104" y="118" width="304" height="252" rx="26" fill="#f4f3ef"/>
  </g>
  <rect x="104" y="118" width="304" height="252" rx="26" fill="url(#dots)"/>
  <!-- ghi chú vàng -->
  <g transform="rotate(-6 186 196)">
    <rect x="132" y="146" width="112" height="104" rx="8" fill="#ffd43b"/>
    <rect x="148" y="174" width="68" height="9" rx="4.5" fill="#c99a00" opacity=".55"/>
    <rect x="148" y="194" width="52" height="9" rx="4.5" fill="#c99a00" opacity=".55"/>
  </g>
  <!-- nét bút -->
  <path d="M272 296 C 296 244, 324 234, 336 258 S 360 300, 378 234"
        fill="none" stroke="#3b5bfd" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chân giá đỡ -->
  <g stroke="#f4f3ef" stroke-width="13" stroke-linecap="round" opacity=".92">
    <line x1="196" y1="374" x2="172" y2="414"/>
    <line x1="316" y1="374" x2="340" y2="414"/>
  </g>
  <rect x="104" y="356" width="304" height="14" rx="7" fill="#dcdbd3"/>
</svg>
